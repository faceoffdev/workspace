version: '3.9'

networks:
  default:
    name: workspace
  proxy:
    name: proxy

services:
  ### Postgres #################################################
  postgres:
    image: ghcr.io/faceoffdev/workspace/postgres:15
    restart: always
    pull_policy: always
    ports:
      - "5432:5432"
    volumes:
      - ${DATA_PATH}/postgres:/var/lib/postgresql/data
      - ${DATA_PATH}/tmp:/tmp/sql
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    ### Если не задать shm, то может появляться ошибка SQLSTATE[53100]: Disk full
    shm_size: 1g
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  ### Traefik #################################################
  proxy:
    image: traefik:latest
    command: --api.insecure=true --providers.docker
    restart: always
    pull_policy: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/traefik.toml:/etc/traefik/traefik.toml
      - ./traefik/acme.json:/acme.json
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.monitor.rule=Host(`monitor.{host:.+}`)
      - traefik.http.services.monitor.loadbalancer.server.port=8080

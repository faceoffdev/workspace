version: '3.9'

networks:
  default:
    name: workspace
  proxy:
    name: proxy

services:
  ### Postgres #################################################
  postgres:
    image: ghcr.io/faceoffdev/workspace/postgres:15
    restart: always
    pull_policy: always
    ports:
      - "8524:5432"
    volumes:
      - ${DATA_PATH}/postgres:/var/lib/postgresql/data
      - ${DATA_PATH}/tmp:/tmp/sql
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    ### Если не задать shm, то может появляться ошибка SQLSTATE[53100]: Disk full
    shm_size: 1g
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  ### Redis #################################################
  redis_lru:
    image: redis:7
    pull_policy: always
    restart: always
    volumes:
      - ${DATA_PATH}/redis_lru:/data

  ### Clickhouse server ######################################
  #clickhouse:
  #  image: yandex/clickhouse-server
  #  environment:
  #    TZ: "Europe/Moscow"
  #  ports:
  #    - "8525:8123"
  #  volumes:
  #    - ${DATA_PATH}/clickhouse:/var/lib/clickhouse

  #grafana:
  #  image: grafana/grafana-oss
  #  ports:
  #    - "8500:3000"
  #  volumes:
  #    - ${DATA_PATH}/grafana:/var/lib/grafana
  #  environment:
  #    - GF_SECURITY_ADMIN_USER=${ADMIN_USER}
  #    - GF_SECURITY_ADMIN_PASSWORD=${ADMIN_PASSWORD}
  #    - GF_USERS_ALLOW_SIGN_UP=false

  ### Traefik #################################################
  proxy:
    image: traefik:latest
    command: --api.insecure=true --providers.docker
    restart: always
    pull_policy: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/traefik.toml:/etc/traefik/traefik.toml
      - ./traefik/acme.json:/acme.json
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.monitor.rule=Host(`monitor.{host:.+}`)
      - traefik.http.services.monitor.loadbalancer.server.port=8080
